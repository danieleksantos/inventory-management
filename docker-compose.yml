version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inventory-net

  backend:
    build: ./backend
    container_name: inventory-backend
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/inventory_db
      - QUARKUS_DATASOURCE_USERNAME=user
      - QUARKUS_DATASOURCE_PASSWORD=password
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=drop-and-create
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventory-net

  frontend:
    build: ./frontend
    container_name: inventory-frontend
    ports:
      - "80:80"
    command: >
      sh -c "echo '----------------------------------------------------------' &&
             echo '🌐 DASHBOARD: http://localhost' &&
             echo '📚 API DOCS: http://localhost:8080/q/swagger-ui/' &&
             echo '----------------------------------------------------------' &&
             nginx -g 'daemon off;'"
    depends_on:
      - backend
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge