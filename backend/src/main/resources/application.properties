quarkus.application.name=inventory-management
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization


# SWAGGER
quarkus.openapi.info.title=Smart Inventory API
quarkus.openapi.info.version=1.0.0
quarkus.openapi.info.description=API para gestão de inventário e sugestão de produção inteligente.
quarkus.swagger-ui.always-include=true